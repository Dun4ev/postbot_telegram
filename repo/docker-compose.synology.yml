services:
  postbot:
    image: python:3.11-slim
    container_name: postbot
    working_dir: /app
    env_file:
      - .env
    environment:
      POSTBOT_DB_PATH: /app/queue.db
      POSTBOT_AUTO_SYNC: "0"
      POSTBOT_LOG_FILE: ""
    command: >
      bash -lc
      "pip install --no-cache-dir -r requirements.txt
      && python bot.py"
    volumes:
      - /volume1/docker/postbot/repo:/app
      - /volume1/docker/postbot/storage:/app/storage
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
